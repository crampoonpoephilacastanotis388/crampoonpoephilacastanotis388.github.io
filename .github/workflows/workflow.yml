name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AD6C60: ${{ secrets.AD6C60 }}
          BE405B: ${{ secrets.BE405B }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AD6C60', '')
          tag_b = os.environ.get('BE405B', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- cc1d48a7b97b2cd9eb27 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 6fbfc55522672c7aa97af665 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
